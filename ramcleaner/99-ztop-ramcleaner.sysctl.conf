# ZTOP ramcleaner — optional kernel tuning (installer: --install-ramcleaner-tuning)
#
# swappiness=150 assumes zram swap is present and cheap. WITHOUT zram, use 10.
vm.swappiness = 150
# zram wants single-page readahead, not the 8-page default meant for disks.
vm.page-cluster = 0
# Start kswapd reclaiming earlier so pressure never arrives as a sudden stall.
vm.watermark_scale_factor = 125
vm.min_free_kbytes = 131072
