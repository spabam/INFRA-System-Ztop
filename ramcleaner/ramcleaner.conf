# ztop-ramcleaner configuration, installed to /etc/ztop/ramcleaner.conf.
# Trusted, operator-owned Bash. Existing configuration is never overwritten.
# New installations preview decisions and log; they do not change memory.
# One active pass: sudo ztop-ramcleaner --apply
# Scheduled actions: explicitly change DRY_RUN to 0 after reviewing the log.
DRY_RUN=1

ENABLE_T1_RECLAIM=1
ENABLE_T2_COMPACT=1
# Swap recycling can cause latency and memory pressure. Enable separately only
# after testing on this workload; --apply/--force-tier do not enable this tier.
ENABLE_T3_SWAP_RECYCLE=0
# Unavailable until service-specific idle probes exist. Enabling this is an error.
ENABLE_T4_PARK_SERVICES=0

T1_AVAIL_MB=2600
T1_PSI_SOME_AVG60=5
T1_COOLDOWN=1200
RECLAIM_TARGETS=(
    "system.slice:10:256"
    "user.slice:8:384"
)
T2_AVAIL_MB=1500
T2_COOLDOWN=3600

# The headroom calculation budgets for ALL pages on the selected disk device;
# it does not deduct free capacity on other swaps. It cannot reserve memory or
# guarantee safety against concurrent allocations. Requires an fstab entry and
# an explicit nonnegative swap priority, restored along with configured options.
T3_SWAP_USED_PCT=80
T3_HEADROOM_FACTOR=15
T3_HEADROOM_FLOOR_MB=512
T3_LOAD_FACTOR=7
T3_COOLDOWN=21600
T3_SWAPOFF_TIMEOUT=120
