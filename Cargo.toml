[package]
name = "ztop"
# Monotonically increasing SemVer; UTC build metadata identifies the build.
# Update release versions with scripts/version.sh. See README §Versioning.
version = "0.9.10+20261120.0942"
edition = "2021"
rust-version = "1.88"
authors = ["Andrea Bodei <info@andreabodei.com>"]
description = "A simple, GPU-aware Linux system monitor"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.1"
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1"

# NVML is Linux-only and optional at runtime — if the library fails to load,
# we degrade gracefully. The Rust dep itself is always compiled in on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.10"
nvml-wrapper-sys = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
